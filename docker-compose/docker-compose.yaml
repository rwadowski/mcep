services:
  psql:
    container_name: database
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=mcep
      - POSTGRES_PASSWORD=mcep
    ports:
      - '5432:5432'
  kafka:
    image: &kafka-image apache/kafka:latest
    container_name: kafka
    ports:
      - '9094:9094'
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server=localhost:9092", "--list" ]
      start_period: 15s
      interval: 10s

  nats:
    container_name: nats
    image: nats:latest
    restart: always
    ports:
      - '4222:4222'

  init-kafka:
    image: *kafka-image
    container_name: kafka-init
    working_dir: /opt/kafka/bin
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic input --replication-factor=1 --partitions=1 --bootstrap-server kafka:9092
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic output --replication-factor=1 --partitions=1 --bootstrap-server kafka:9092
